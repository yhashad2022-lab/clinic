<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجلات المرضى - المركز الطبي التخصصي</title>
<link rel="stylesheet" href="css/styles.css"></head><body>
<div id="loginScreen" class="login-screen">
  <form id="loginForm" class="login-card">
    <div class="login-icon">🏥</div><h1>تسجيل الدخول</h1>
    <p>المركز الطبي التخصصي — سجلات المرضى</p>
    <label for="loginEmail">البريد الإلكتروني</label><input id="loginEmail" type="email" autocomplete="username" required>
    <label for="loginPassword">كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password" required>
    <button class="p" type="submit">دخول</button><div id="loginError" role="alert"></div>
  </form>
</div>
<div id="appShell"><div class="w">
<h1>🏥 المركز الطبي التخصصي — سجلات المرضى</h1>
<div class="st"><div><b id="s1"></b><span>عيادة</span></div><div><b id="s2"></b><span>مريض مسجل</span></div><div><b id="s3"></b><span>متوسط مرضى العيادة</span></div></div>
<div class="bar"><input id="q" type="search" placeholder="🔍 ابحث بالاسم أو رقم الملف" autocomplete="off"><select id="cs"></select><button class="p" id="add">➕ مريض جديد</button></div>
<div class="cl" id="chips"></div>
<div class="info" id="info"></div><div id="list"></div><button class="more" id="more" style="display:none">عرض المزيد</button>
</div><!-- appShell content -->
<div id="userBar" class="user-bar"><span id="userEmail"></span><button id="logoutBtn">تسجيل الخروج</button><span id="syncStatus">جاري الاتصال...</span></div></div><!-- appShell -->
<div class="m" id="md"><div class="box" id="bx"></div></div>
<div id="vw"></div>

<input type="file" id="fc" accept="image/*" capture="environment" hidden><input type="file" id="fg" accept="image/*" multiple hidden>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/app.js"></script></body></html>
